<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Submitted - Online Examination Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="glass-card p-5 text-center" style="max-width: 550px; width: 100%;">
    <div class="mb-3 text-emerald display-1">
      <i class="bi bi-check-circle-fill"></i>
    </div>
    <h3 class="fw-bold mb-2 text-dark">Examination Submitted!</h3>
    <p class="text-muted mb-4">Your responses for <strong id="submittedExamTitle">Your Examination</strong> have been successfully recorded.</p>

    <div class="p-3 rounded border section-bg text-start small mb-4">
      <div class="d-flex justify-content-between mb-1">
        <span class="text-muted">Submission / Attempt ID:</span>
        <strong class="text-dark font-monospace" id="submittedAttemptId">#--</strong>
      </div>
      <div class="d-flex justify-content-between mb-1">
        <span class="text-muted">Questions Answered:</span>
        <strong class="text-emerald" id="submittedAnsweredCount">--</strong>
      </div>
      <div class="d-flex justify-content-between">
        <span class="text-muted">Status:</span>
        <strong class="text-info" id="submittedStatus">SUBMITTED</strong>
      </div>
    </div>

    <div class="d-flex gap-2 justify-content-center">
      <a href="/student/dashboard.html" class="btn btn-primary-custom px-4 py-2">
        Return to Dashboard <i class="bi bi-house-door-fill"></i>
      </a>
      <a href="/student/results/list.html" class="btn btn-outline-primary px-4 py-2">
        View Results <i class="bi bi-graph-up"></i>
      </a>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.requireAuth('Student');
      if (!user) return;

      const params = new URLSearchParams(window.location.search);
      const attemptId = params.get('attemptId');

      if (!attemptId) return;

      try {
        const res = await apiFetch(`/attempts/${attemptId}`);
        const attempt = (res && typeof res.json === 'function') ? await res.json() : res;
        if (attempt) {
          document.getElementById('submittedExamTitle').innerText = attempt.examTitle || 'Exam';
          document.getElementById('submittedAttemptId').innerText = `#ATTEMPT-${attempt.attemptId}`;
          
          const answers = attempt.answers || [];
          const answered = answers.filter(a => a.isAnswered).length;
          document.getElementById('submittedAnsweredCount').innerText = `${answered} answered`;
          const statusEl = document.getElementById('submittedStatus');
          statusEl.innerText = attempt.status || 'SUBMITTED';
          if (attempt.submissionReason === 'AUTO_SUBMITTED_TAB_SWITCH_LIMIT') {
            statusEl.className = 'text-danger fw-bold';
            statusEl.innerHTML = `AUTO-SUBMITTED <div class="text-danger small fw-normal mt-1"><i class="bi bi-shield-slash me-1"></i> Security Limit Reached (Tab-Switching)</div>`;
          }
        }
      } catch (err) {
        console.error('Error fetching submitted attempt:', err);
      }
    });
  </script>
</body>
</html>

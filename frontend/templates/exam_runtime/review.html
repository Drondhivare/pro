<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pre-Submission Review - MMCOE Exam Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="container py-5" style="max-width: 800px;">
    <div class="glass-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-light p-3 rounded-circle border mb-3">
          <i class="bi bi-file-earmark-check-fill text-warning fs-2"></i>
        </div>
        <h3 class="fw-bold mb-1 text-dark">Pre-Submission Attempt Review</h3>
        <p class="text-muted small m-0" id="reviewExamSubtitle">Loading exam review details...</p>
      </div>

      <div class="row g-3 text-center mb-4">
        <div class="col-4">
          <div class="p-3 rounded border section-bg">
            <span class="text-muted small">Total Questions</span>
            <h4 class="fw-bold text-dark m-0" id="statTotalQuestions">0</h4>
          </div>
        </div>
        <div class="col-4">
          <div class="p-3 rounded border section-bg">
            <span class="text-muted small">Answered</span>
            <h4 class="fw-bold text-emerald m-0" id="statAnsweredQuestions">0</h4>
          </div>
        </div>
        <div class="col-4">
          <div class="p-3 rounded border section-bg">
            <span class="text-muted small">Unanswered</span>
            <h4 class="fw-bold text-muted m-0" id="statUnansweredQuestions">0</h4>
          </div>
        </div>
      </div>

      <div class="table-responsive mb-4">
        <table class="table table-hover align-middle small">
          <thead>
            <tr class="text-muted">
              <th>Q#</th>
              <th>Question Type</th>
              <th>Status</th>
              <th>Review Flag</th>
            </tr>
          </thead>
          <tbody id="reviewQuestionsTableBody">
            <tr>
              <td colspan="4" class="text-center text-muted py-3">Loading question status...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between">
        <a href="#" id="btnReturnToExam" class="btn btn-outline-secondary">
          &larr; Return to Question Palette
        </a>
        <button type="button" id="btnSubmitExam" class="btn btn-success px-4 fw-bold" onclick="finalizeSubmission()">
          <i class="bi bi-send-fill me-1"></i> Finalize & Submit Exam Attempt
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    let attemptId = null;
    let examId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.requireAuth('Student');
      if (!user) return;

      const params = new URLSearchParams(window.location.search);
      attemptId = params.get('attemptId');
      examId = params.get('examId');

      if (!attemptId || !examId) {
        alert('Invalid review session parameters.');
        window.location.href = '/student/dashboard.html';
        return;
      }

      document.getElementById('btnReturnToExam').href = `/exam_runtime/exam.html?attemptId=${attemptId}&examId=${examId}`;
      await loadReviewData();
    });

    async function loadReviewData() {
      try {
        const [attempt, questions, answersRaw] = await Promise.all([
          apiFetch(`/attempts/${attemptId}`),
          apiFetch(`/exams/${examId}/questions`),
          apiFetch(`/attempts/${attemptId}/answers`).catch(() => [])
        ]);

        if (!attempt || !questions) {
          alert('Failed to load review data.');
          return;
        }

        const answers = Array.isArray(answersRaw) ? answersRaw : [];

        // Check if attempt already submitted
        if (attempt.status !== 'IN_PROGRESS') {
          alert('This exam has already been submitted.');
          window.location.href = `/exam_runtime/submitted.html?attemptId=${attemptId}`;
          return;
        }

        // Subtitle
        document.getElementById('reviewExamSubtitle').innerText = `${attempt.examCode || 'EXAM'} • ${attempt.examTitle || 'Exam'}`;

        // Map answers
        const answerMap = {};
        answers.forEach(a => {
          answerMap[a.questionId] = a;
        });

        let answeredCount = 0;
        const rowsHtml = questions.map((q, idx) => {
          const num = idx + 1;
          const ans = answerMap[q.questionId];
          const isAnswered = ans && ans.isAnswered;
          if (isAnswered) answeredCount++;
          const isReview = ans && ans.isMarkedForReview;

          const statusBadge = isAnswered
            ? '<span class="badge bg-success">ANSWERED</span>'
            : '<span class="badge bg-secondary">UNANSWERED</span>';

          const reviewBadge = isReview
            ? '<span class="badge bg-warning text-dark">★ REVIEW</span>'
            : '<span class="text-muted">No</span>';

          return `
            <tr>
              <td class="fw-bold">Q${num}</td>
              <td>${escapeHtml(q.questionType || 'MCQ')}</td>
              <td>${statusBadge}</td>
              <td>${reviewBadge}</td>
            </tr>
          `;
        }).join('');

        document.getElementById('statTotalQuestions').innerText = questions.length;
        document.getElementById('statAnsweredQuestions').innerText = answeredCount;
        document.getElementById('statUnansweredQuestions').innerText = questions.length - answeredCount;
        document.getElementById('reviewQuestionsTableBody').innerHTML = rowsHtml;

      } catch (err) {
        console.error('Error loading review:', err);
        alert('Could not load attempt review: ' + err.message);
      }
    }

    async function finalizeSubmission() {
      if (!confirm('Are you sure you want to submit your examination? Once submitted, you cannot change your answers.')) {
        return;
      }

      const btn = document.getElementById('btnSubmitExam');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Submitting...';

      try {
        const res = await apiFetch(`/attempts/${attemptId}/submit`, {
          method: 'POST',
          body: JSON.stringify({ autoSubmitted: false })
        });

        if (res.ok) {
          window.location.href = `/exam_runtime/submitted.html?attemptId=${attemptId}`;
        } else {
          const errData = await res.json();
          alert(errData.error || 'Submission failed.');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-send-fill me-1"></i> Finalize & Submit Exam Attempt';
        }
      } catch (err) {
        console.error('Error submitting exam:', err);
        alert('An error occurred during submission: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send-fill me-1"></i> Finalize & Submit Exam Attempt';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - MMCOE Exam Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background: radial-gradient(circle at top right, rgba(139, 21, 43, 0.08), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(27, 54, 93, 0.08), transparent 45%),
                  var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 2.5rem;
      border-top: 4px solid var(--mmcoe-maroon);
    }
  </style>
</head>
<body>

  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-light p-3 rounded-circle border mb-3">
        <i class="bi bi-shield-lock-fill text-success fs-2"></i>
      </div>
      <h3 class="fw-bold mb-1 text-dark">Set New Password</h3>
      <p class="text-muted small">Enter your new secure password using Argon2id protection</p>
    </div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="mb-3">
        <label for="newPassword" class="form-label small fw-semibold text-dark">New Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control form-control-custom" id="newPassword" placeholder="Minimum 8 characters" required>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('newPassword', 'p1Icon')">
            <i class="bi bi-eye" id="p1Icon"></i>
          </button>
        </div>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label small fw-semibold text-dark">Confirm New Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
          <input type="password" class="form-control form-control-custom" id="confirmPassword" placeholder="Re-enter new password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2 justify-content-center fs-6">
        <i class="bi bi-check-circle-fill"></i> Reset Password
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    async function handleReset(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;

      if (p1 !== p2) {
        showToast('Passwords do not match!', 'warning');
        return;
      }
      if (p1.length < 8) {
        showToast('Password must be at least 8 characters!', 'warning');
        return;
      }

      const email = new URLSearchParams(window.location.search).get('email') || '';
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalHtml = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Updating...';

      try {
        await apiFetch('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ email, newPassword: p1 })
        });
        showToast('Password reset successful! Sign in now.', 'success');
        setTimeout(() => {
          window.location.href = '/auth/login.html';
        }, 800);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalHtml;
        showToast(err.message || 'Password reset failed', 'danger');
      }
    }
  </script>
</body>
</html>

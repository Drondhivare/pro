<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - MMCOE Online Examination Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background: radial-gradient(circle at top right, rgba(139, 21, 43, 0.08), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(27, 54, 93, 0.08), transparent 45%),
                  var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 520px;
      padding: 2.5rem;
      border-top: 4px solid var(--mmcoe-maroon);
    }
  </style>
</head>
<body>

  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-light p-3 rounded-circle border mb-3">
        <i class="bi bi-person-plus-fill text-danger fs-2"></i>
      </div>
      <h3 class="fw-bold mb-1 text-dark">Student Registration</h3>
      <p class="text-muted small">Create your student account to access MMCOE examinations</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="firstName" class="form-label small fw-semibold text-dark">First Name</label>
          <input type="text" class="form-control form-control-custom" id="firstName" placeholder="e.g. Rutuja / Shlok" required>
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label small fw-semibold text-dark">Last Name</label>
          <input type="text" class="form-control form-control-custom" id="lastName" placeholder="e.g. Ghodekar / Powar" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold text-dark">College Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control form-control-custom" id="email" placeholder="student@college.edu" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label small fw-semibold text-dark">Phone Number (User Table Spec)</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
          <input type="tel" class="form-control form-control-custom" id="phone" placeholder="9876543210" pattern="[0-9]{10}" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label small fw-semibold text-dark">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control form-control-custom" id="password" placeholder="Minimum 8 characters" required>
          <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password', 'passIcon')">
            <i class="bi bi-eye" id="passIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="termsCheck" required>
        <label class="form-check-label small text-muted" for="termsCheck">
          I agree to the MMCOE Examination Rules & Honor Code Policy
        </label>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2 justify-content-center fs-6">
        <i class="bi bi-check-circle-fill"></i> Complete Registration
      </button>
    </form>

    <div class="text-center mt-4 border-top pt-3">
      <span class="text-muted small">Already have an account?</span>
      <a href="/auth/login.html" class="text-info small fw-semibold text-decoration-none ms-1">Sign In Here</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalHtml = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...';

      const payload = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value,
        roleId: 3 // Student
      };

      try {
        await apiFetch('/auth/register', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        showToast('Registration successful! Redirecting to login...', 'success');
        setTimeout(() => {
          window.location.href = '/auth/login.html';
        }, 800);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalHtml;
        showToast(err.message || 'Registration failed', 'danger');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - MMCOE Exam Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background: radial-gradient(circle at top right, rgba(139, 21, 43, 0.08), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(27, 54, 93, 0.08), transparent 45%),
                  var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 2.5rem;
      border-top: 4px solid var(--mmcoe-maroon);
    }
  </style>
</head>
<body>

  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-light p-3 rounded-circle border mb-3">
        <i class="bi bi-key-fill text-warning fs-2"></i>
      </div>
      <h3 class="fw-bold mb-1 text-dark">Forgot Password</h3>
      <p class="text-muted small">Enter your college email address to receive password reset instructions</p>
    </div>

    <form id="forgotForm" onsubmit="handleForgot(event)">
      <div class="mb-4">
        <label for="email" class="form-label small fw-semibold text-dark">College Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control form-control-custom" id="email" placeholder="student@college.edu" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2 justify-content-center fs-6">
        <i class="bi bi-send-fill"></i> Send Reset Link
      </button>
    </form>

    <div class="text-center mt-4 border-top pt-3">
      <a href="/auth/login.html" class="text-info small fw-semibold text-decoration-none">&larr; Back to Login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalHtml = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

      try {
        await apiFetch('/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        showToast('Password reset link generated. Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = `/auth/reset_password.html?email=${encodeURIComponent(email)}`;
        }, 800);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalHtml;
        showToast(err.message || 'Request failed', 'danger');
      }
    }
  </script>
</body>
</html>

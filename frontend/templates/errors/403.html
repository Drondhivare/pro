<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Access Denied - MMCOE Exam Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="glass-card text-center p-5" style="max-width: 500px;">
    <div class="display-1 fw-bold text-warning mb-2">403</div>
    <h4 class="fw-bold mb-2">Access Denied (RBAC Restricted)</h4>
    <p class="text-muted small mb-4">Your current system role does not grant permission to view this module. (RolePermission Violation)</p>
    <a href="/" class="btn btn-primary-custom px-4 py-2">
      <i class="bi bi-shield-lock-fill me-1"></i> Return to Authorized Dashboard
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
